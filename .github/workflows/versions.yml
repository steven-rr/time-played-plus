name: Game versions

# Once a day, compare the TOC with Blizzard's current game versions.
# When a newer version appears on a test realm, open an issue that says to test the addon there.
# When a version goes live, open an issue that says to test it on the live game and what to change.
# Nothing in the repository is changed and nothing is released from here.

on:
  schedule:
    - cron: "0 17 * * *" # every day at 17:00 UTC (noon US Eastern, 9 AM Pacific, winter time)
  workflow_dispatch:
    inputs:
      pretend:
        description: "Test only: pretend a game version, for example wow_classic_era=1.15.10 (live) or wowt=12.2.0 (test realm)"
        required: false

permissions:
  contents: read
  issues: write
  actions: write

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v6

      - name: Compare the TOC with Blizzard's current versions
        id: check
        env:
          PRETEND: ${{ inputs.pretend }}
        run: python3 .github/scripts/game_versions.py

      - name: Find an issue this check opened earlier
        id: issue
        run: |
          number=$(gh issue list --state open --json number,title --jq '[.[] | select(.title | startswith("Game versions:"))][0].number // empty')
          echo "number=$number" >> "$GITHUB_OUTPUT"

      - name: Open or update the issue
        if: steps.check.outputs.open == 'true'
        env:
          TITLE: ${{ steps.check.outputs.title }}
          NUMBER: ${{ steps.issue.outputs.number }}
        run: |
          if [ -n "$NUMBER" ]; then
            before=$(gh issue view "$NUMBER" --json title --jq .title)
            gh issue edit "$NUMBER" --title "$TITLE" --body-file "$RUNNER_TEMP/game_versions.md"
            # Editing an issue notifies nobody, a comment does. Say so when the news is different.
            if [ "$before" != "$TITLE" ]; then
              gh issue comment "$NUMBER" --body "This changed. It is now: $TITLE. The description above has the details."
            fi
          else
            gh issue create --title "$TITLE" --body-file "$RUNNER_TEMP/game_versions.md" --assignee "$GITHUB_REPOSITORY_OWNER"
          fi

      - name: Close the issue once nothing is left to change or test
        if: steps.check.outputs.open == 'false' && steps.issue.outputs.number != ''
        env:
          NUMBER: ${{ steps.issue.outputs.number }}
        run: gh issue close "$NUMBER" --comment "Nothing is left to change or test."

      # GitHub pauses scheduled workflows after 60 days without activity in the repository.
      # Re-enabling it on every run keeps this one going.
      - name: Keep this schedule alive
        run: gh api --silent -X PUT "repos/$GITHUB_REPOSITORY/actions/workflows/versions.yml/enable"
